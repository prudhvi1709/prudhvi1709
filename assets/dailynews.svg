<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title"><title id="title">Dailynews. RSS to an AI-assisted news digest. Collected, ranked and delivered. READ THE DIGEST.</title><g font-family="Arial,Helvetica,sans-serif"><style>
      .tool-module{animation:unpack 4.8s ease-in-out both}
      .presentation{animation:present 3.6s ease-out both}
      .screen-lines,.broadcast{stroke-dasharray:200;animation:draw-screen 4.2s ease-out both}
      .news-sheet{animation:publish 3.6s ease-out both;animation-delay:var(--delay)}
      @keyframes unpack{0%,100%{transform:translateY(0px)}30%,60%{transform:translateY(var(--lift))}}
      @keyframes present{0%{opacity:.25;transform:translateY(7px)}40%,100%{opacity:1;transform:translateY(0px)}}
      @keyframes draw-screen{0%{stroke-dashoffset:200}65%,100%{stroke-dashoffset:0}}
      @keyframes publish{0%{transform:translate(10px,-16px);opacity:.3}70%,100%{transform:translate(0px,0px);opacity:1}}
      @media(prefers-reduced-motion:reduce){.tool-module,.presentation,.screen-lines,.broadcast,.news-sheet{animation:none}}
      </style><rect width="1200" height="370" rx="12" fill="#2455cb"/>
      <text x="48" y="66" fill="#e0e8ff" font-size="19" font-family="ui-monospace,Consolas,monospace" letter-spacing="2">03 / SIGNAL FROM THE NOISE</text>
      <text x="48" y="142" fill="#f4f0e8" font-size="62" font-weight="750" letter-spacing="-2">Dailynews</text>
      <text x="48" y="192" fill="#f4f0e8" font-size="28" >RSS to an AI-assisted news digest.</text>
      <text x="48" y="229" fill="#f4f0e8" font-size="28" >Collected, ranked and delivered.</text>
      <text x="48" y="284" fill="#e0e8ff" font-size="19" font-family="ui-monospace,Consolas,monospace" letter-spacing="2">RSS / LLMs / GITHUB ACTIONS</text>
      <path d="M48 311H1152" stroke="#e0e8ff" stroke-opacity=".25"/>
